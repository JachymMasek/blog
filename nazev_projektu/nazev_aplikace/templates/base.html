<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}MySite{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:   #0f0e0c;
      --paper: #f5f0e8;
      --accent:#c94f2a;
      --muted: #8a8070;
      --nav-h: 72px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ── NAV ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--nav-h);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 3rem;
      background: var(--paper);
      border-bottom: 1px solid rgba(15,14,12,.12);
      z-index: 100;
    }

    .logo {
      font-family: 'DM Serif Display', serif;
      font-size: 1.4rem;
      color: var(--ink);
      text-decoration: none;
      letter-spacing: -.02em;
    }
    .logo span { color: var(--accent); }

    .nav-links { display: flex; gap: 2rem; list-style: none; }

    .nav-links a {
      font-size: .9rem;
      font-weight: 500;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      position: relative;
      transition: color .2s;
    }
    .nav-links a::after {
      content: '';
      position: absolute; bottom: -4px; left: 0; right: 0;
      height: 1.5px;
      background: var(--accent);
      transform: scaleX(0);
      transition: transform .25s ease;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--ink); }
    .nav-links a:hover::after, .nav-links a.active::after { transform: scaleX(1); }

    /* ── MAIN ── */
    main {
      flex: 1;
      margin-top: var(--nav-h);
      padding: 0;
    }

    /* ── HERO BAND ── */
    .page-hero {
      padding: 5rem 3rem 3rem;
      border-bottom: 1px solid rgba(15,14,12,.1);
      position: relative;
      overflow: hidden;
    }
    .page-hero::before {
      content: attr(data-label);
      position: absolute; right: 3rem; top: 50%; transform: translateY(-50%);
      font-family: 'DM Serif Display', serif;
      font-size: 9rem;
      color: rgba(15,14,12,.04);
      pointer-events: none;
      line-height: 1;
    }

    .page-hero h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2.5rem, 6vw, 5rem);
      line-height: 1.05;
      letter-spacing: -.03em;
      max-width: 700px;
    }
    .page-hero h1 em {
      color: var(--accent);
      font-style: italic;
    }
    .page-hero p {
      margin-top: 1.2rem;
      max-width: 520px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 1.05rem;
    }

    /* ── CONTENT AREA ── */
    .content {
      padding: 4rem 3rem;
      max-width: 900px;
    }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid rgba(15,14,12,.12);
      padding: 1.5rem 3rem;
      display: flex; align-items: center; justify-content: space-between;
      font-size: .8rem;
      color: var(--muted);
    }

    /* ── ANIMATE IN ── */
    @keyframes fadeUp {
      from { opacity:0; transform: translateY(18px); }
      to   { opacity:1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp .55s ease both; }
    .fade-up-2 { animation: fadeUp .55s .1s ease both; }
    .fade-up-3 { animation: fadeUp .55s .2s ease both; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>

<nav>
  <a class="logo" href="{% url 'home' %}">My<span>Site</span></a>
  <ul class="nav-links">
    <li><a href="{% url 'home' %}"    {% if request.resolver_match.url_name == 'home'    %}class="active"{% endif %}>Home</a></li>
    <li><a href="{% url 'about' %}"   {% if request.resolver_match.url_name == 'about'   %}class="active"{% endif %}>About</a></li>
    <li><a href="{% url 'contact' %}" {% if request.resolver_match.url_name == 'contact' %}class="active"{% endif %}>Contact</a></li>
    <li><a href="{% url 'zkusebni_stranka' %}" {% if request.resolver_match.url_name == 'zkusebni_stranka' %}class="active"{% endif %}>Zkušební stránka</a></li>
    <li><a href="{% url 'article_list' %}" {% if request.resolver_match.url_name == 'article_list' %}class="active"{% endif %}>Blog</a></li>
  </ul>
</nav>

<main>
  {% block content %}{% endblock %}
</main>

<footer>
  <span>© 2026 MySite</span>
  <span>Postaveno s Django</span>
</footer>

</body>
</html>
