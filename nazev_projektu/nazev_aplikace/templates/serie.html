{% extends 'base.html' %}

{% block title %}O Backrooms{% endblock %}

{% block extra_head %}
<style>
  .serie-section {
    max-width: 900px;
    margin: 0 auto;
    padding: 6rem 3rem;
    text-align: center;
  }

  .serie-section h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(3rem, 6vw, 5rem);
    line-height: 1.05;
    letter-spacing: -.03em;
    margin-bottom: 2rem;
  }

  .serie-section h1 em {
    color: var(--accent);
    font-style: italic;
  }

  .divider {
    width: 60px;
    height: 2px;
    background: var(--accent);
    margin: 0 auto 2.5rem;
  }

  .serie-section p {
    max-width: 700px;
    margin: 0 auto 1.5rem;
    color: var(--muted);
    line-height: 1.9;
    font-size: 1.05rem;
  }

  .serie-section p:last-of-type {
    margin-bottom: 2.5rem;
  }

  .serie-link {
    display: inline-block;
    color: var(--accent);
    text-decoration: none;
    font-size: .88rem;
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  .serie-link:hover {
    text-decoration: underline;
  }
</style>
{% endblock %}

{% block content %}
<section class="serie-section">
  <h1 class="fade-up">Sé<em>rie</em></h1>

  <div class="divider fade-up-2"></div>

  <p class="fade-up-2">
    Text
  </p>



</section>
{% endblock %}
