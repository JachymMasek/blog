{% extends 'base.html' %}

{% block title %}O Backrooms{% endblock %}

{% block extra_head %}
<style>
  .serie-section {
    max-width: 900px;
    margin: 0 auto;
    padding: 6rem 3rem;
    text-align: center;
  }

  .serie-section h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(3rem, 6vw, 5rem);
    line-height: 1.05;
    letter-spacing: -.03em;
    margin-bottom: 2rem;
  }

  .serie-section h1 em {
    color: var(--accent);
    font-style: italic;
  }

  .divider {
    width: 60px;
    height: 2px;
    background: var(--accent);
    margin: 0 auto 2.5rem;
  }

  .serie-section p {
    max-width: 700px;
    margin: 0 auto 1.5rem;
    color: var(--muted);
    line-height: 1.9;
    font-size: 1.05rem;
  }

  .serie-section p:last-of-type {
    margin-bottom: 2.5rem;
  }

  .serie-link {
    display: inline-block;
    color: var(--accent);
    text-decoration: none;
    font-size: .88rem;
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  .serie-link:hover {
    text-decoration: underline;
  }

  .timeline {
  position: relative;
  max-width: 1100px;
  margin: 5rem auto 0;
  padding: 2rem 0;
  }

  .timeline::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--ink);
    transform: translateX(-50%);
  }

  .timeline-item {
    position: relative;
    display: flex;
    align-items: center;
    margin-bottom: 5rem;
  }

  .timeline-item.left .timeline-date {
  right: calc(42% + 2rem);  /* Vpravo od karty */
  }
  
  .timeline-item.right .timeline-date {
    left: calc(42% + 2rem);   /* Vlevo od karty */
  }

  .timeline-card {
    width: 42%;
    min-height: 180px;
    border: 2px solid var(--ink);
    padding: 2rem;
    background: rgba(255,255,255,.15);
  }

  .timeline-card h3 {
    margin-bottom: 1rem;
    font-size: 1.2rem;
  }

  .timeline-date {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: .9rem;
    font-weight: 500;
    background: var(--paper);
    padding: .3rem .8rem;
  }

  .timeline-dot {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 16px;
    height: 16px;
    background: var(--ink);
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  @media (max-width: 900px) {
    .timeline::before {
      left: 20px;
    }

    .timeline-item,
    .timeline-item.left,
    .timeline-item.right {
      justify-content: flex-start;
    }

    .timeline-card {
      width: calc(100% - 60px);
      margin-left: 60px;
    }

    .timeline-dot {
      left: 20px;
    }

    .timeline-date {
      left: 20px;
      transform: none;
      top: -25px;
    }
}
</style>
{% endblock %}

{% block content %}
<section class="serie-section">
  <h1 class="fade-up">Sé<em>rie</em></h1>

  <div class="divider fade-up-2"></div>

  <p class="fade-up-2">
    Text funguj prosim
  </p>


  <div class="timeline">

    <div class="timeline-item left">
      <div class="timeline-card">
        <h3>Název videa</h3>
      </div>

      <div class="timeline-dot"></div>
      <div class="timeline-date">Datum</div>
    </div>

    <div class="timeline-item right">
      <div class="timeline-card">
        <h3>Název videa</h3>
      </div>

      <div class="timeline-dot"></div>
      <div class="timeline-date">Datum</div>
    </div>

    <div class="timeline-item left">
      <div class="timeline-card">
        <h3>Název videa</h3>
      </div>

      <div class="timeline-dot"></div>
      <div class="timeline-date">Datum</div>
    </div>

  </div>



</section>
{% endblock %}
